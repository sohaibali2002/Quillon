name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node tests/smoke.mjs
      - run: npm run check:salesforce
      - run: npm run check:hubspot
      - run: npm run check:netsuite
      - run: npm run check:costpoint
      - run: npm run check:openrouter
      - run: npm run check:orchestration
